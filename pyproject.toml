[project]
name = "psychsearch"
version = "0.1.0"
description = "Test combinations of literature search strings: hit counts, sample records and relevance signals, plus PsycInfo-ready syntax."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "plotly>=7.1.0",
    "rich>=13.7",
    "websocket-client>=1.9.2",
]

[project.scripts]
psychsearch = "psychsearch.cli:main"
psychsearch-hasse = "psychsearch.hasse:main"
psychsearch-ui = "psychsearch.ui:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # long lines are fine here: many are one-line messages or HTML

[tool.ruff.lint.isort]
split-on-trailing-comma = false
